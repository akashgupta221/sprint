openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Agile Project Management API. Manages Projects → User Stories → Tasks for small teams, with asynchronous email notifications.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: members
    description: Team members
  - name: projects
    description: Projects
  - name: stories
    description: User stories within projects
  - name: tasks
    description: Tasks within user stories
  - name: notifications
    description: Email notifications (async outbox)
  - name: dashboard
    description: Aggregate dashboard views
  - name: epics
    description: Epics grouping related stories
  - name: sprints
    description: Time-boxed sprints and sprint planning
  - name: comments
    description: Issue comments with @mention notifications
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /members:
    get:
      operationId: listMembers
      tags: [members]
      summary: List team members
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Member"
    post:
      operationId: createMember
      tags: [members]
      summary: Create a team member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMemberInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "400":
          $ref: "#/components/responses/BadRequest"

  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List all projects with summary counts
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectSummary"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"

  /projects/{projectId}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get a project with its stories and tasks
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDetail"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update a project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete a project (cascades to stories and tasks)
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "204":
          description: Deleted

  /projects/{projectId}/stories:
    get:
      operationId: listStories
      tags: [stories]
      summary: List user stories for a project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StorySummary"
    post:
      operationId: createStory
      tags: [stories]
      summary: Create a user story under a project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStoryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Story"

  /stories/{storyId}:
    get:
      operationId: getStory
      tags: [stories]
      summary: Get a single user story with tasks
      parameters:
        - $ref: "#/components/parameters/StoryId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoryDetail"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateStory
      tags: [stories]
      summary: Update a user story
      parameters:
        - $ref: "#/components/parameters/StoryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStoryInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Story"
    delete:
      operationId: deleteStory
      tags: [stories]
      summary: Delete a user story (cascades to tasks)
      parameters:
        - $ref: "#/components/parameters/StoryId"
      responses:
        "204":
          description: Deleted

  /stories/{storyId}/tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      summary: List tasks under a user story
      parameters:
        - $ref: "#/components/parameters/StoryId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
    post:
      operationId: createTask
      tags: [tasks]
      summary: Create a task under a user story
      parameters:
        - $ref: "#/components/parameters/StoryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

  /tasks/{taskId}:
    get:
      operationId: getTask
      tags: [tasks]
      summary: Get a single task
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateTask
      tags: [tasks]
      summary: Update a task. Triggers an async email notification when assignee or status changes.
      parameters:
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTaskInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
    delete:
      operationId: deleteTask
      tags: [tasks]
      summary: Delete a task
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "204":
          description: Deleted

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: High-level counts and breakdowns across all projects
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      summary: Recent activity across all projects (last 20 events)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityEvent"

  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List recent notifications from the email outbox
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"

  /notifications/{notificationId}/retry:
    post:
      operationId: retryNotification
      tags: [notifications]
      summary: Manually requeue a failed notification
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"

  /projects/{projectId}/epics:
    get:
      operationId: listEpics
      tags: [epics]
      summary: List epics for a project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EpicSummary"
    post:
      operationId: createEpic
      tags: [epics]
      summary: Create an epic under a project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEpicInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Epic"

  /epics/{epicId}:
    get:
      operationId: getEpic
      tags: [epics]
      summary: Get an epic with its stories
      parameters:
        - $ref: "#/components/parameters/EpicId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EpicSummary"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateEpic
      tags: [epics]
      summary: Update an epic
      parameters:
        - $ref: "#/components/parameters/EpicId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEpicInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Epic"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteEpic
      tags: [epics]
      summary: Delete an epic (stories keep their data, epic reference cleared)
      parameters:
        - $ref: "#/components/parameters/EpicId"
      responses:
        "204":
          description: Deleted

  /projects/{projectId}/sprints:
    get:
      operationId: listSprints
      tags: [sprints]
      summary: List sprints for a project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SprintSummary"
    post:
      operationId: createSprint
      tags: [sprints]
      summary: Create a planned sprint
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSprintInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sprint"

  /sprints/{sprintId}:
    get:
      operationId: getSprint
      tags: [sprints]
      summary: Get a sprint with its stories
      parameters:
        - $ref: "#/components/parameters/SprintId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SprintSummary"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateSprint
      tags: [sprints]
      summary: Update sprint name, goal or dates
      parameters:
        - $ref: "#/components/parameters/SprintId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSprintInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sprint"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteSprint
      tags: [sprints]
      summary: Delete a sprint (stories return to the backlog)
      parameters:
        - $ref: "#/components/parameters/SprintId"
      responses:
        "204":
          description: Deleted

  /sprints/{sprintId}/stories:
    post:
      operationId: addStoriesToSprint
      tags: [sprints]
      summary: Move stories into a sprint
      parameters:
        - $ref: "#/components/parameters/SprintId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddStoriesToSprintInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SprintSummary"
        "404":
          $ref: "#/components/responses/NotFound"

  /sprints/{sprintId}/stories/remove:
    post:
      operationId: removeStoriesFromSprint
      tags: [sprints]
      summary: Move stories back to the backlog
      parameters:
        - $ref: "#/components/parameters/SprintId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddStoriesToSprintInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SprintSummary"
        "404":
          $ref: "#/components/responses/NotFound"

  /sprints/{sprintId}/start:
    post:
      operationId: startSprint
      tags: [sprints]
      summary: Start a planned sprint (only one active sprint per project)
      parameters:
        - $ref: "#/components/parameters/SprintId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sprint"
        "409":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /sprints/{sprintId}/complete:
    post:
      operationId: completeSprint
      tags: [sprints]
      summary: Complete the active sprint (unfinished stories return to the backlog)
      parameters:
        - $ref: "#/components/parameters/SprintId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sprint"
        "409":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /sprints/{sprintId}/burndown:
    get:
      operationId: getSprintBurndown
      tags: [sprints]
      summary: Remaining story points per day for a sprint
      parameters:
        - $ref: "#/components/parameters/SprintId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BurndownReport"
        "404":
          $ref: "#/components/responses/NotFound"

  /stories/{storyId}/comments:
    get:
      operationId: listStoryComments
      tags: [comments]
      summary: List comments on a story
      parameters:
        - $ref: "#/components/parameters/StoryId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Comment"
    post:
      operationId: createStoryComment
      tags: [comments]
      summary: Comment on a story (@memberName mentions notify members)
      parameters:
        - $ref: "#/components/parameters/StoryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"

  /tasks/{taskId}/comments:
    get:
      operationId: listTaskComments
      tags: [comments]
      summary: List comments on a task
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Comment"
    post:
      operationId: createTaskComment
      tags: [comments]
      summary: Comment on a task (@memberName mentions notify members)
      parameters:
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"

  /comments/{commentId}:
    delete:
      operationId: deleteComment
      tags: [comments]
      summary: Delete a comment
      parameters:
        - $ref: "#/components/parameters/CommentId"
      responses:
        "204":
          description: Deleted

components:
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: integer
    StoryId:
      name: storyId
      in: path
      required: true
      schema:
        type: integer
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: integer
    EpicId:
      name: epicId
      in: path
      required: true
      schema:
        type: integer
    SprintId:
      name: sprintId
      in: path
      required: true
      schema:
        type: integer
    CommentId:
      name: commentId
      in: path
      required: true
      schema:
        type: integer

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

    Member:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [admin, member]
        createdAt:
          type: string
          format: date-time
      required: [id, name, email, role, createdAt]

    CreateMemberInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        role:
          type: string
          enum: [admin, member]
          default: member
      required: [name, email]

    Project:
      type: object
      properties:
        id:
          type: integer
        key:
          type: string
          description: Short uppercase key (e.g. "WEB", "API")
        name:
          type: string
        description:
          type: ["string", "null"]
        status:
          type: string
          enum: [active, archived, completed]
        ownerId:
          type: ["integer", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, key, name, description, status, ownerId, createdAt, updatedAt]

    ProjectSummary:
      allOf:
        - $ref: "#/components/schemas/Project"
        - type: object
          properties:
            owner:
              oneOf:
                - $ref: "#/components/schemas/Member"
                - type: "null"
            storyCount:
              type: integer
            taskCount:
              type: integer
            tasksDone:
              type: integer
            tasksInProgress:
              type: integer
            tasksTodo:
              type: integer
          required: [owner, storyCount, taskCount, tasksDone, tasksInProgress, tasksTodo]

    ProjectDetail:
      allOf:
        - $ref: "#/components/schemas/ProjectSummary"
        - type: object
          properties:
            stories:
              type: array
              items:
                $ref: "#/components/schemas/StoryDetail"
          required: [stories]

    CreateProjectInput:
      type: object
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 10
        name:
          type: string
          minLength: 1
        description:
          type: ["string", "null"]
        ownerId:
          type: ["integer", "null"]
      required: [key, name]

    UpdateProjectInput:
      type: object
      properties:
        name:
          type: string
        description:
          type: ["string", "null"]
        status:
          type: string
          enum: [active, archived, completed]
        ownerId:
          type: ["integer", "null"]

    Story:
      type: object
      properties:
        id:
          type: integer
        projectId:
          type: integer
        title:
          type: string
        description:
          type: ["string", "null"]
        acceptanceCriteria:
          type: ["string", "null"]
        type:
          type: string
          enum: [story, bug, spike]
        status:
          type: string
          enum: [backlog, ready, in_progress, review, done]
        priority:
          type: string
          enum: [low, medium, high, urgent]
        storyPoints:
          type: ["integer", "null"]
        epicId:
          type: ["integer", "null"]
        sprintId:
          type: ["integer", "null"]
        assigneeId:
          type: ["integer", "null"]
        assignee:
          oneOf:
            - $ref: "#/components/schemas/Member"
            - type: "null"
        labels:
          type: array
          items:
            type: string
        rank:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, projectId, title, description, acceptanceCriteria, type, status, priority, storyPoints, epicId, sprintId, assigneeId, assignee, labels, rank, createdAt, updatedAt]

    StorySummary:
      allOf:
        - $ref: "#/components/schemas/Story"
        - type: object
          properties:
            taskCount:
              type: integer
            tasksDone:
              type: integer
          required: [taskCount, tasksDone]

    StoryDetail:
      allOf:
        - $ref: "#/components/schemas/Story"
        - type: object
          properties:
            tasks:
              type: array
              items:
                $ref: "#/components/schemas/Task"
          required: [tasks]

    CreateStoryInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: ["string", "null"]
        acceptanceCriteria:
          type: ["string", "null"]
        type:
          type: string
          enum: [story, bug, spike]
          default: story
        priority:
          type: string
          enum: [low, medium, high, urgent]
          default: medium
        storyPoints:
          type: ["integer", "null"]
        epicId:
          type: ["integer", "null"]
        sprintId:
          type: ["integer", "null"]
        assigneeId:
          type: ["integer", "null"]
        labels:
          type: array
          items:
            type: string
      required: [title]

    UpdateStoryInput:
      type: object
      properties:
        title:
          type: string
        description:
          type: ["string", "null"]
        acceptanceCriteria:
          type: ["string", "null"]
        type:
          type: string
          enum: [story, bug, spike]
        status:
          type: string
          enum: [backlog, ready, in_progress, review, done]
        priority:
          type: string
          enum: [low, medium, high, urgent]
        storyPoints:
          type: ["integer", "null"]
        epicId:
          type: ["integer", "null"]
        sprintId:
          type: ["integer", "null"]
        assigneeId:
          type: ["integer", "null"]
        labels:
          type: array
          items:
            type: string
        rank:
          type: integer

    Task:
      type: object
      properties:
        id:
          type: integer
        storyId:
          type: integer
        title:
          type: string
        description:
          type: ["string", "null"]
        status:
          type: string
          enum: [todo, in_progress, blocked, done]
        assigneeId:
          type: ["integer", "null"]
        assignee:
          oneOf:
            - $ref: "#/components/schemas/Member"
            - type: "null"
        estimateHours:
